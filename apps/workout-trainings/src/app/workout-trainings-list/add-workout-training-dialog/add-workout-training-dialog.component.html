<div class="AddTrainingDialog_MainContainer">
    <h2 mat-dialog-title>{{ 'apps.workout-trainings.list.addTraining.title' | translate }}</h2>
    <mat-dialog-content class="mat-typography">
        <workout-tracker-training-form #workoutTrainingFormComponent>
        </workout-tracker-training-form>
    </mat-dialog-content>
    <mat-dialog-actions align="end">
        <button mat-button mat-dialog-close>
            {{ 'common.actions.cancel' | translate }}
        </button>
        <button *ngIf="getStepperIndex() !== 1" mat-button
            (click)="nextStep()" [disabled]="!workoutTrainingFormComponent.isFormValid()">
            {{ 'common.actions.next' | translate }}
        </button>
        <button *ngIf="getStepperIndex() === 1" mat-button [mat-dialog-close]="false"
            (click)="createTraining()" [disabled]="!workoutTrainingFormComponent.isFormValid()">
            {{ 'common.actions.create' | translate }}
        </button>
    </mat-dialog-actions>
</div>
