<div class="TrainingForm_MainContainer">
        <mat-stepper orientation="vertical" linear #stepper animationDuration="700">
            <mat-step [stepControl]="form" [label]="'apps.workout-trainings.list.trainingForm.step.basicInfo.title' | translate">
                <form [formGroup]="form">
                    <workout-tracker-muscle-groups-selector
                        [label]="'apps.workout-trainings.list.trainingForm.step.basicInfo.form.fields.muscleGroup' | translate"
                        [errorLabel]="(form.controls.muscleGroups.hasError('required') || form.controls.muscleGroups.hasError('minLength')) ?
                            ('apps.workout-trainings.list.trainingForm.step.basicInfo.form.errors.muscleGroupRequired' | translate) :
                            null"
                        [formGroup]="form"
                        [formControlName]="'muscleGroups'">
                    </workout-tracker-muscle-groups-selector>
                </form>
            </mat-step>
            <mat-step [label]="'apps.workout-trainings.list.trainingForm.step.aditionalInfo.title' | translate">
                <form [formGroup]="form">
                    <mat-form-field>
                        <mat-label>
                            {{ 'apps.workout-trainings.list.trainingForm.step.aditionalInfo.form.fields.observations' | translate }}
                        </mat-label>
                        <input matInput id="observations" name="observations" formControlName="observations"/>
                    </mat-form-field>
                </form>
            </mat-step>
        </mat-stepper>
</div>
